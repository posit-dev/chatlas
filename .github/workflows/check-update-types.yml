name: Check Provider Types & Pricing

on:
  workflow_dispatch:
  push:
    branches: ["main", "rc-*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]

env:
  UV_VERSION: "0.4.x"
  PYTHON_VERSION: 3.13

permissions:
  contents: write

jobs:
  check-types-and-pricing:
    name: Check provider types and pricing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v7

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📦 Install the project
        run: uv sync --python ${{ env.PYTHON_VERSION }} --all-extras

      - name: Run type and pricing update
        run: |
          make update-types
          make update-pricing

      - name: Check for changes
        id: check
        run: |
          echo "Checking for changes in types and pricing..."
          git status chatlas/types chatlas/data/prices.json
          git diff --stat chatlas/types chatlas/data/prices.json
          if [[ -n $(git status --porcelain chatlas/types chatlas/data/prices.json) ]]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fix (same-repo PRs only)
        if: >
          steps.check.outputs.dirty == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chatlas/types chatlas/data/prices.json
          git commit -m "chore: update provider types and pricing data"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "::error::Provider types and/or pricing were out of date. A fix commit was pushed to this branch; CI will re-run automatically."
          exit 1

      - name: Fail with diff (fork PRs / push / workflow_dispatch / release)
        if: >
          steps.check.outputs.dirty == 'true' &&
          !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git status --porcelain chatlas/types chatlas/data/prices.json
          git diff chatlas/types chatlas/data/prices.json
          echo "::error::Provider types and/or pricing are out of date. Please run 'make update-types' and 'make update-pricing' locally and commit the changes."
          exit 1
