name: Test

on:
  workflow_dispatch:
  push:
    branches: ["main", "rc-*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Note: Dummy API keys for VCR replay testing are set in the Makefile.
    # This workflow will not make any live API calls; those are reserved for
    # the test-live.yml workflow.

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        # The eval extra (inspect-ai>=0.3.283) requires Python >= 3.11
        run: |
          EXTRA_ARGS="--all-extras"
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            EXTRA_ARGS="--all-extras --no-extra eval"
          fi
          uv sync --python ${{ matrix.python-version }} $EXTRA_ARGS

      - name: Check tests
        run: make check-tests

      # Types/formatting only need one leg: dependency versions are uniform
      # across the matrix, and the eval extra (inspect-ai) isn't installed on 3.10
      - name: Check types
        if: matrix.python-version == '3.13'
        run: make check-types

      - name: Check formatting
        if: matrix.python-version == '3.13'
        run: make check-format
